version: '3.8'

services:
  backend:
    build: .
    ports:
      - "13265:8000"
    volumes:
      - ./backend:/app
      - ./temp_audio:/app/temp_audio
    environment:
      - OLLAMA_ENDPOINT=http://0.0.0.0:11434
    depends_on:
      - ollama
    networks:
      - voice-net

  ollama:
    image: ollama/ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - voice-net

  frontend:
    image: nginx:alpine
    ports:
      - "13264:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - voice-net

volumes:
  ollama_models:

networks:
  voice-net:
