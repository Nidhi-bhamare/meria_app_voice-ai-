<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech-to-Ollama-to-Speech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        #status {
            margin: 20px 0;
            color: #666;
        }
        #response {
            white-space: pre-wrap;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Speech to Ollama AI</h1>
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
    <div id="status">Status: Idle</div>
    <div id="response"></div>

    <script>
        const API_URL = 'http://localhost:11434/api/generate';
        const MODEL_NAME = 'llama3:latest';

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');

        let recognition;
        let isRecording = false;
        let finalTranscript = '';

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (window.SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                responseDiv.textContent = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                statusDiv.textContent = `Error: ${event.error}`;
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                }
            };
        } else {
            statusDiv.textContent = 'Speech recognition not supported in this browser';
            startBtn.disabled = true;
        }

        startBtn.addEventListener('click', () => {
            isRecording = true;
            finalTranscript = '';
            responseDiv.textContent = '';
            recognition.start();
            statusDiv.textContent = 'Status: Recording...';
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', async () => {
            isRecording = false;
            recognition.stop();
            statusDiv.textContent = 'Status: Processing...';
            startBtn.disabled = false;
            stopBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        prompt: finalTranscript,
                        stream: false
                    })
                });

                const data = await response.json();
                const aiResponse = data.response;

                responseDiv.textContent = aiResponse;

                const utterance = new SpeechSynthesisUtterance(aiResponse);
                window.speechSynthesis.speak(utterance);

                statusDiv.textContent = 'Status: Idle';
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
